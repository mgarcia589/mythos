[project]
name = "mythos"
version = "0.7.0"
description = "Automated compliance review engine for IRS e-file XML returns"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "lxml>=5.0",
    "rich>=13.0",
    "click>=8.0",
    "reportlab>=4.0",
    "nicegui>=1.4",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
mythos = "lab.xml_parser.cli:cli"

[tool.pytest.ini_options]
testpaths = ["lab/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that use real XML files (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
